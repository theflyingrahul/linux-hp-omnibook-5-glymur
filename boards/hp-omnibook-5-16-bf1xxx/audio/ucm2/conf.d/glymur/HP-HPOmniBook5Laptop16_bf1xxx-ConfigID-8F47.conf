# HP OmniBook 5 16-bf1xxx: 2x WSA884x speakers (swr0) | 2x DMIC
# Card driver "glymur", long name from the board's DMI. Based on
# alsa-ucm-conf's Qualcomm/glymur/ASUS-Zenbook-A14-UX3407NA.conf; the mute
# LEDs as in Qualcomm/x1e80100/LENOVO-T14s.conf.
Syntax 6

SectionUseCase."HiFi" {
	File "/HP/OmniBook-5-16-bf1xxx/HiFi.conf"
	Comment "HiFi quality Music"
}

Include.led.File "/common/ctl/led.conf"
Macro [
	{ CtlNew { Arg="name='Speakers Switch' type=bool,count=1 on" } }
	{ SetLED { LED="speaker" Action="attach" CtlId="Speakers Switch" } }
	{ CtlNew { Arg="name='Mic LED Capture Switch' type=bool,count=1 off" } }
	{ SetLED { LED="mic" Action="attach" CtlId="Mic LED Capture Switch" } }
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
Include.wsam-init.File "/HP/OmniBook-5-16-bf1xxx/wsa-macro-init.conf"

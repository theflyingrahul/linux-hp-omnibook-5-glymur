# Use case configuration for the HP OmniBook 5 16-bf1xxx.
# Based on alsa-ucm-conf's Qualcomm/glymur/ZenbookA14-HiFi.conf; the
# capture format matches this board's topology (S16_LE). The mute switches
# are the user controls the card's top-level file creates for the LEDs.

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Include.wsae.File "/codecs/wsa884x/two-speakers/DefaultEnableSeq.conf"
	Include.wsm1e.File "/HP/OmniBook-5-16-bf1xxx/Wsa1SpeakerEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speakers"

	Include.wsmspk1e.File "/HP/OmniBook-5-16-bf1xxx/Wsa1SpeakerEnableSeq.conf"
	Include.wsmspk1d.File "/HP/OmniBook-5-16-bf1xxx/Wsa1SpeakerDisableSeq.conf"
	Include.wsaspk.File "/codecs/wsa884x/two-speakers/SpeakerSeq.conf"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
		PlaybackSwitch "Speakers Switch"
	}
}

SectionDevice."Mic" {
	Comment "Microphone Array"

	Include.vadm0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "Mic LED"
		CaptureSwitch "Mic LED Capture Switch"
		Format S16_LE
	}
}

# Kernel -17 workaround (2026-10-23): WirePlumber's v4l2 monitor blocks its
# event queue while the Iris video codec cannot power on, which leaves the
# sound card on profile "off" with no default sink and no stream linking.
# The libcamera monitor still offers the camera to PipeWire.
# See docs/runbook-results-17-2026-10-23.md. Remove once Iris opens again.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}

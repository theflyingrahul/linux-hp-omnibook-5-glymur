# HP OmniBook 5 16-bf1xxx: the names Windows uses for the built-in audio.
# The card takes the name of Qualcomm's Windows driver; the speakers and
# microphones are matched by their UCM PCM (device 0 and 1 of the card).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
        alsa.card_name = "MAHUA-HP-OmniBook-5-16-bf1xxx"
      }
    ]
    actions = {
      update-props = {
        device.description = "Qualcomm(R) Aqstic(TM) ACX Static Endpoints Audio Device"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        api.alsa.path = "~.*hw:MAHUAHPOmniBook,0$"
      }
    ]
    actions = {
      update-props = {
        node.description = "Internal Speakers"
        node.nick = "Internal Speakers"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        api.alsa.path = "~.*hw:MAHUAHPOmniBook,1$"
      }
    ]
    actions = {
      update-props = {
        node.description = "Microphone Array"
        node.nick = "Microphone Array"
      }
    }
  }
]

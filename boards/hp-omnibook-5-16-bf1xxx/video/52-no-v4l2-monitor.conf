# For a boot with Iris on (test-iris device tree) only: WirePlumber's V4L2
# monitor opens every video node, and an Iris node that cannot power on
# stalls it, and with it the audio session (docs/runbook-results-17-2026-10-23.md).
# Copy to ~/.config/wireplumber/wireplumber.conf.d/ before that boot and
# remove it afterwards; while it is there PipeWire offers no cameras.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}

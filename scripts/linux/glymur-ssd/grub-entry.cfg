#
# Device-tree boots: the newest kernel with the HP DTB that
# install-kernel.sh installed next to it (/boot/glymur-dtb). With a device
# tree the kernel ignores the ACPI tables, so neither the ACPI board
# parameters nor the DSDT override apply. A missing DTB loads no kernel, so
# GRUB reports an error and returns to the menu (`exit` would leave GRUB for
# the next UEFI boot entry). Were GRUB's `devicetree` command unavailable
# (Ubuntu's signed grubaa64.efi does contain it), GRUB would report the
# error and boot ACPI instead.
menuentry 'Ubuntu on SSD: device tree (full)' {
    set gfxpayload=keep
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx.dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur, DTB: full"
            linux ($glymur_ssd)/boot/vmlinuz-glymur root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline console=tty0 loglevel=4
            devicetree ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx.dtb
        else
            echo "No device tree installed on the SSD; run install-kernel.sh first."
            sleep 10
        fi
    fi
}
menuentry 'Ubuntu on SSD: device tree (minimal)' {
    set gfxpayload=keep
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-minimal.dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur, DTB: minimal"
            linux ($glymur_ssd)/boot/vmlinuz-glymur root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline console=tty0 loglevel=4
            devicetree ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-minimal.dtb
        else
            echo "No device tree installed on the SSD; run install-kernel.sh first."
            sleep 10
        fi
    fi
}
#
# Display lab: the SSD's 7.3.0-rc2-glymur-3 kernel (the release the lab
# modules are built for) with the display-lab DTB from this USB's
# glymur-tools/lab kit. It boots like the minimal device tree; the lab is
# then started by hand (glymur-tools/lab/start-lab.sh).
menuentry 'Ubuntu on SSD: display lab (device tree)' {
    set gfxpayload=keep
    set glymur_usb=$root
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/vmlinuz-7.3.0-rc2-glymur-3 ]; then
            if [ -f ($glymur_usb)/glymur-tools/lab/mahua-hp-omnibook-5-bf1xxx-lab.dtb ]; then
                echo "Kernel: 7.3.0-rc2-glymur-3, DTB: display lab"
                linux ($glymur_ssd)/boot/vmlinuz-7.3.0-rc2-glymur-3 root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline log_buf_len=16M console=tty0 loglevel=4
                devicetree ($glymur_usb)/glymur-tools/lab/mahua-hp-omnibook-5-bf1xxx-lab.dtb
            else
                echo "The display-lab kit is not on this USB."
                sleep 10
            fi
        else
            echo "Kernel 7.3.0-rc2-glymur-3 is not installed on the SSD."
            sleep 10
        fi
    fi
}
menuentry 'Ubuntu on SSD: qcom-next @KREL@' {
    set gfxpayload=keep
    set glymur_usb=$root
    set glymur_kernel=($glymur_usb)/glymur-boot/vmlinuz-@KREL@
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/vmlinuz-@KREL@ ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-@KREL@
        fi

}
# The full device tree with DRM driver and DP debug messages in the
# persistent journal, for display bring-up.
menuentry 'Ubuntu on SSD: device tree (full, DRM debug)' {
    set gfxpayload=keep
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx.dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur, DTB: full, DRM debug"
            linux ($glymur_ssd)/boot/vmlinuz-glymur root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline drm.debug=0x102 log_buf_len=16M console=tty0 loglevel=4
            devicetree ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx.dtb
        else
            echo "No device tree installed on the SSD; run install-kernel.sh first."
            sleep 10
        fi
    fi
}
# GPU test (kernel -5 on): the full device tree with the Adreno GPU and
# the SCMI polling fix, from the installed kernel package. Kept apart from
# "device tree (full)", whose display is proven, until the GPU is.
menuentry 'Ubuntu on SSD: device tree (GPU test)' {
    set gfxpayload=keep
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-gpu.dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur, DTB: GPU test"
            linux ($glymur_ssd)/boot/vmlinuz-glymur root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline log_buf_len=16M console=tty0 loglevel=4
            devicetree ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-gpu.dtb
        else
            echo "No GPU test device tree on the SSD; install kernel -5 first."
            sleep 10
        fi
    fi
}
# GPU and USB-A test: the GPU test device tree plus the right-hand USB-A
# port (usb_2). Its DTB is the installed kernel package's once one ships
# it, and until then the copy on this USB (glymur-tools/usb-test/).
menuentry 'Ubuntu on SSD: device tree (GPU and USB-A test)' {
    set gfxpayload=keep
    set glymur_usb=$root
    set glymur_dtb=($glymur_usb)/glymur-tools/usb-test/mahua-hp-omnibook-5-bf1xxx-usb.dtb
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-usb.dtb ]; then
            set glymur_dtb=($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-usb.dtb
        fi
        if [ -f $glymur_dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur, DTB: $glymur_dtb"
            linux ($glymur_ssd)/boot/vmlinuz-glymur root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline log_buf_len=16M console=tty0 loglevel=4
            devicetree $glymur_dtb
        else
            echo "No USB-A test device tree found."
            sleep 10
        fi
    fi
}
#
# ACPI boots, with the board command line and the BIOS-gated DSDT override.
menuentry 'Ubuntu on SSD: ACPI, newest glymur kernel' {
    set gfxpayload=keep
    set glymur_usb=$root
    set glymur_kernel=($glymur_usb)/glymur-boot/vmlinuz-@KREL@
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/vmlinuz-glymur ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-glymur
        elif [ -f ($glymur_ssd)/boot/vmlinuz-@KREL@ ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-@KREL@
        fi
    fi
    echo "Kernel: $glymur_kernel"
    linux $glymur_kernel root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline @BOARD_CMDLINE@ console=tty0 loglevel=4
    smbios --type 0 --get-string 5 --set glymur_bios
    if [ "$glymur_bios" = "@BIOS@" ]; then
        initrd ($glymur_usb)/glymur-tools/acpi-override/acpi-override.cpio
    fi
}
menuentry 'Ubuntu on SSD: ACPI, previous glymur kernel' {
    set gfxpayload=keep
    set glymur_usb=$root
    set glymur_kernel=($glymur_usb)/glymur-boot/vmlinuz-@KREL@
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/vmlinuz-glymur.old ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-glymur.old
        elif [ -f ($glymur_ssd)/boot/vmlinuz-@KREL@ ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-@KREL@
        fi
    fi
    echo "Kernel: $glymur_kernel"
    linux $glymur_kernel root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline @BOARD_CMDLINE@ console=tty0 loglevel=4
    smbios --type 0 --get-string 5 --set glymur_bios
    if [ "$glymur_bios" = "@BIOS@" ]; then
        initrd ($glymur_usb)/glymur-tools/acpi-override/acpi-override.cpio
    fi
}

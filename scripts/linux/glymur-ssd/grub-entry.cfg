# Template filled in by make-kit.sh: @KREL@, @PARTUUID@, @BOARD_CMDLINE@, @BIOS@.
# GRUB on the USB only reads the SSD: the kernel comes from the glymur-root
# filesystem's /boot (the copy on the USB is the fallback), the root is the
# partition by its unique GPT GUID, and nothing touches the SSD's EFI
# partition. The kernel has NVMe and ext4 built in, so no initramfs is needed;
# the only initrd is the BIOS-gated DSDT _OSC override (CPU idle).
#
# Order: the current test entry, the device-tree boots, then the ACPI
# boots. The ACPI entries boot /boot/vmlinuz-glymur and vmlinuz-glymur.old,
# symlinks that glymur-ssd/install-kernel.sh rotates on the SSD, so a new
# kernel needs no change here. Before the first install-kernel.sh run they
# fall back to the release this USB was staged with. ACPI boots are the
# ones with a working USB port.
#
# eDP test (2026-09-29): the full device tree with the eDP link limited to
# the firmware's 2 lanes at up to 2.7 Gb/s, built by
# glymur-lab/build-test-dtb.sh against 7.3.0-rc2-glymur-3 and loaded from
# this USB. DRM driver and DP debug messages go to the persistent journal.
menuentry 'Ubuntu on SSD: eDP test, 2 lanes (device tree)' {
    set gfxpayload=keep
    set glymur_usb=$root
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/vmlinuz-7.3.0-rc2-glymur-3 ]; then
            if [ -f ($glymur_usb)/glymur-tools/edp-test/mahua-hp-omnibook-5-bf1xxx-edp-2lane.dtb ]; then
                echo "Kernel: 7.3.0-rc2-glymur-3, DTB: eDP 2-lane test"
                linux ($glymur_ssd)/boot/vmlinuz-7.3.0-rc2-glymur-3 root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline drm.debug=0x102 log_buf_len=16M console=tty0 loglevel=4
                devicetree ($glymur_usb)/glymur-tools/edp-test/mahua-hp-omnibook-5-bf1xxx-edp-2lane.dtb
            else
                echo "The eDP test DTB is not on this USB."
                sleep 10
            fi
        else
            echo "Kernel 7.3.0-rc2-glymur-3 is not installed on the SSD."
            sleep 10
        fi
    fi
}
#
# Device-tree boots: the newest kernel with the HP DTB that
# install-kernel.sh installed next to it (/boot/glymur-dtb). With a device
# tree the kernel ignores the ACPI tables, so neither the ACPI board
# parameters nor the DSDT override apply. A missing DTB loads no kernel, so
# GRUB reports an error and returns to the menu (`exit` would leave GRUB for
# the next UEFI boot entry). Were GRUB's `devicetree` command unavailable
# (Ubuntu's signed grubaa64.efi does contain it), GRUB would report the
# error and boot ACPI instead.
menuentry 'Ubuntu on SSD: device tree (minimal)' {
    set gfxpayload=keep
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-minimal.dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur, DTB: minimal"
            linux ($glymur_ssd)/boot/vmlinuz-glymur root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline console=tty0 loglevel=4
            devicetree ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-minimal.dtb
        else
            echo "No device tree installed on the SSD; run install-kernel.sh first."
            sleep 10
        fi
    fi
}
menuentry 'Ubuntu on SSD: device tree (full)' {
    set gfxpayload=keep
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx.dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur, DTB: full"
            linux ($glymur_ssd)/boot/vmlinuz-glymur root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline console=tty0 loglevel=4
            devicetree ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx.dtb
        else
            echo "No device tree installed on the SSD; run install-kernel.sh first."
            sleep 10
        fi
    fi
}
#
# ACPI boots, with the board command line and the BIOS-gated DSDT override.
menuentry 'Ubuntu on SSD: ACPI, newest glymur kernel' {
    set gfxpayload=keep
    set glymur_usb=$root
    set glymur_kernel=($glymur_usb)/glymur-boot/vmlinuz-@KREL@
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/vmlinuz-glymur ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-glymur
        elif [ -f ($glymur_ssd)/boot/vmlinuz-@KREL@ ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-@KREL@
        fi
    fi
    echo "Kernel: $glymur_kernel"
    linux $glymur_kernel root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline @BOARD_CMDLINE@ console=tty0 loglevel=4
    smbios --type 0 --get-string 5 --set glymur_bios
    if [ "$glymur_bios" = "@BIOS@" ]; then
        initrd ($glymur_usb)/glymur-tools/acpi-override/acpi-override.cpio
    fi
}
menuentry 'Ubuntu on SSD: ACPI, previous glymur kernel' {
    set gfxpayload=keep
    set glymur_usb=$root
    set glymur_kernel=($glymur_usb)/glymur-boot/vmlinuz-@KREL@
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/vmlinuz-glymur.old ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-glymur.old
        elif [ -f ($glymur_ssd)/boot/vmlinuz-@KREL@ ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-@KREL@
        fi
    fi
    echo "Kernel: $glymur_kernel"
    linux $glymur_kernel root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline @BOARD_CMDLINE@ console=tty0 loglevel=4
    smbios --type 0 --get-string 5 --set glymur_bios
    if [ "$glymur_bios" = "@BIOS@" ]; then
        initrd ($glymur_usb)/glymur-tools/acpi-override/acpi-override.cpio
    fi
}

# Template filled in by make-kit.sh: @KREL@, @PARTUUID@, @BOARD_CMDLINE@, @BIOS@.
# GRUB on the USB only reads the SSD: the kernel comes from the glymur-root
# filesystem's /boot, the root is the partition by its unique GPT GUID, and
# nothing touches the SSD's EFI partition. The kernel has NVMe and ext4
# built in, so no initramfs is needed.
#
# Kernels and device trees: /boot/vmlinuz-glymur and /boot/glymur-dtb are
# the newest kernel and its DTBs, vmlinuz-glymur.old and glymur-dtb.old the
# previous ones; glymur-ssd/install-kernel.sh rotates them, so a new kernel
# needs no change here. Kernels before -11 have no daily DTB with USB; their
# "-usb" DTB is the same configuration and is used instead. A missing DTB
# loads no kernel: GRUB reports it and returns to the menu.
#
# Entries (2026-09-30):
#  - "Ubuntu on SSD": the daily device tree, everything proven;
#  - "test device tree": the daily one plus what is being tested;
#  - "previous kernel": the daily device tree of the previous kernel;
#  - "fallback": no native display or GPU, the firmware framebuffer;
#  - "ACPI": no device tree, the board command line and the BIOS-gated
#    DSDT _OSC override. Fewer devices than the device tree; last resort.
# For display debugging, press e on an entry and add drm.debug=0x102.
menuentry 'Ubuntu on SSD' {
    set gfxpayload=keep
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        set glymur_dtb=($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx.dtb
        if [ -f ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-usb.dtb ]; then
            set glymur_dtb=($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-usb.dtb
        fi
        if [ -f $glymur_dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur, DTB: $glymur_dtb"
            linux ($glymur_ssd)/boot/vmlinuz-glymur root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline log_buf_len=16M console=tty0 loglevel=4
            devicetree $glymur_dtb
        else
            echo "No device tree installed on the SSD; run install-kernel.sh first."
            sleep 10
        fi
    fi
}
menuentry 'Ubuntu on SSD: test device tree' {
    set gfxpayload=keep
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        set glymur_dtb=($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-test.dtb
        if [ -f $glymur_dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur, DTB: $glymur_dtb"
            linux ($glymur_ssd)/boot/vmlinuz-glymur root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline log_buf_len=16M console=tty0 loglevel=4
            devicetree $glymur_dtb
        else
            echo "The newest kernel has no test device tree (kernel -11 on)."
            sleep 10
        fi
    fi
}
menuentry 'Ubuntu on SSD: previous kernel' {
    set gfxpayload=keep
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        set glymur_dtb=($glymur_ssd)/boot/glymur-dtb.old/mahua-hp-omnibook-5-bf1xxx.dtb
        if [ -f ($glymur_ssd)/boot/glymur-dtb.old/mahua-hp-omnibook-5-bf1xxx-usb.dtb ]; then
            set glymur_dtb=($glymur_ssd)/boot/glymur-dtb.old/mahua-hp-omnibook-5-bf1xxx-usb.dtb
        fi
        if [ ! -f ($glymur_ssd)/boot/vmlinuz-glymur.old ]; then
            set glymur_dtb=none
        fi
        if [ -f $glymur_dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur.old, DTB: $glymur_dtb"
            linux ($glymur_ssd)/boot/vmlinuz-glymur.old root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline log_buf_len=16M console=tty0 loglevel=4
            devicetree $glymur_dtb
        else
            echo "No previous kernel with a device tree on the SSD."
            sleep 10
        fi
    fi
}
menuentry 'Ubuntu on SSD: fallback, firmware display (minimal device tree)' {
    set gfxpayload=keep
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-minimal.dtb ]; then
            echo "Kernel: ($glymur_ssd)/boot/vmlinuz-glymur, DTB: minimal"
            linux ($glymur_ssd)/boot/vmlinuz-glymur root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline log_buf_len=16M console=tty0 loglevel=4
            devicetree ($glymur_ssd)/boot/glymur-dtb/mahua-hp-omnibook-5-bf1xxx-minimal.dtb
        else
            echo "No device tree installed on the SSD; run install-kernel.sh first."
            sleep 10
        fi
    fi
}
menuentry 'Ubuntu on SSD: ACPI (no device tree)' {
    set gfxpayload=keep
    set glymur_usb=$root
    set glymur_kernel=($glymur_usb)/glymur-boot/vmlinuz-@KREL@
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/vmlinuz-glymur ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-glymur
        elif [ -f ($glymur_ssd)/boot/vmlinuz-@KREL@ ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-@KREL@
        fi
    fi
    echo "Kernel: $glymur_kernel"
    linux $glymur_kernel root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline @BOARD_CMDLINE@ console=tty0 loglevel=4
    smbios --type 0 --get-string 5 --set glymur_bios
    if [ "$glymur_bios" = "@BIOS@" ]; then
        initrd ($glymur_usb)/glymur-tools/acpi-override/acpi-override.cpio
    fi
}

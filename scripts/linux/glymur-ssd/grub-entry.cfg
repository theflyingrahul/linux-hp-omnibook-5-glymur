# Template filled in by make-kit.sh: @KREL@, @PARTUUID@, @BOARD_CMDLINE@, @BIOS@.
# GRUB on the USB only reads the SSD: the kernel comes from the glymur-root
# filesystem's /boot (the copy on the USB is the fallback), the root is the
# partition by its unique GPT GUID, and nothing touches the SSD's EFI
# partition. The kernel has NVMe and ext4 built in, so no initramfs is needed;
# the only initrd is the BIOS-gated DSDT _OSC override (CPU idle).
#
# The first two entries boot /boot/vmlinuz-glymur and vmlinuz-glymur.old,
# symlinks that glymur-ssd/install-kernel.sh rotates on the SSD, so a new
# kernel needs no change here. Before the first install-kernel.sh run they
# fall back to the release this USB was staged with.
menuentry 'Ubuntu on SSD: newest glymur kernel' {
    set gfxpayload=keep
    set glymur_usb=$root
    set glymur_kernel=($glymur_usb)/glymur-boot/vmlinuz-@KREL@
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/vmlinuz-glymur ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-glymur
        elif [ -f ($glymur_ssd)/boot/vmlinuz-@KREL@ ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-@KREL@
        fi
    fi
    echo "Kernel: $glymur_kernel"
    linux $glymur_kernel root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline @BOARD_CMDLINE@ console=tty0 loglevel=4
    smbios --type 0 --get-string 5 --set glymur_bios
    if [ "$glymur_bios" = "@BIOS@" ]; then
        initrd ($glymur_usb)/glymur-tools/acpi-override/acpi-override.cpio
    fi
}
menuentry 'Ubuntu on SSD: previous glymur kernel' {
    set gfxpayload=keep
    set glymur_usb=$root
    set glymur_kernel=($glymur_usb)/glymur-boot/vmlinuz-@KREL@
    if search --no-floppy --label glymur-root --set=glymur_ssd; then
        if [ -f ($glymur_ssd)/boot/vmlinuz-glymur.old ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-glymur.old
        elif [ -f ($glymur_ssd)/boot/vmlinuz-@KREL@ ]; then
            set glymur_kernel=($glymur_ssd)/boot/vmlinuz-@KREL@
        fi
    fi
    echo "Kernel: $glymur_kernel"
    linux $glymur_kernel root=PARTUUID=@PARTUUID@ rootfstype=ext4 ro rootwait $cmdline @BOARD_CMDLINE@ console=tty0 loglevel=4
    smbios --type 0 --get-string 5 --set glymur_bios
    if [ "$glymur_bios" = "@BIOS@" ]; then

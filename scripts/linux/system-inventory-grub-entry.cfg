menuentry 'Glymur whole-system inventory (RAM live)' {
    set gfxpayload=keep
    linux /casper/vmlinuz toram nopersistent noprompt $cmdline systemd.run=/cdrom/glymur-tools/glymur-system-inventory.sh systemd.run_success_action=poweroff systemd.run_failure_action=poweroff --- console=tty0 systemd.show_status=true loglevel=6 plymouth.enable=0
    initrd /casper/initrd
}

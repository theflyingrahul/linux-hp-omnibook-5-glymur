menuentry 'Glymur QCOM0F10 timing snapshot (Ubuntu live)' {
    set gfxpayload=keep
    linux /casper/vmlinuz persistent $cmdline systemd.run=/cdrom/glymur-tools/glymur-qcom0f10-snapshot.sh systemd.run_success_action=poweroff systemd.run_failure_action=poweroff --- console=tty0 systemd.show_status=true loglevel=7 ignore_loglevel plymouth.enable=0
    initrd /casper/initrd
}

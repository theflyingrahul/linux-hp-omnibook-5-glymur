menuentry 'Glymur right USB-A 2.0 hot-plug capture (RAM live)' {
    set gfxpayload=keep
    linux /casper/vmlinuz toram nopersistent $cmdline systemd.run=/cdrom/glymur-tools/glymur-usb2-hotplug-collector.sh systemd.run_success_action=poweroff systemd.run_failure_action=poweroff --- console=tty0 systemd.show_status=true loglevel=7 ignore_loglevel plymouth.enable=0
    initrd /casper/initrd
}

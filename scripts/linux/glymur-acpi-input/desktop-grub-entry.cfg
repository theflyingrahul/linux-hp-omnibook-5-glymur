menuentry 'Glymur live desktop: keyboard, touchpad, Wi-Fi (RAM live)' {
    set gfxpayload=keep
    linux /casper/vmlinuz toram nopersistent noprompt $cmdline systemd.run=/cdrom/glymur-tools/acpi-input/glymur-live-desktop-setup.sh systemd.run_success_action=none systemd.run_failure_action=none --- console=tty0 loglevel=4
    initrd /casper/initrd
}
